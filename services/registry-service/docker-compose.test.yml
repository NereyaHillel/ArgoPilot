# Throwaway PostgreSQL for the registry-service tests.
#
# Usage, from services/registry-service:
#   docker compose -f docker-compose.test.yml up -d --wait
#   export TEST_DATABASE_URL=postgresql://registry:registry@localhost:55432/registry_test
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry
      POSTGRES_DB: registry_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d registry_test"]
      interval: 2s
      timeout: 3s
      retries: 30
